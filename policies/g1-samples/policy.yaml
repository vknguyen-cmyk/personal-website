# Single pretrained WBC tracker — switch clips, not networks.
schemaVersion: '1'
name: G1 Wbc-G1
description: One unified 29-DoF G1 motion-tracking policy. Motions come from
  reference clips under reference/; the same policy.onnx is used for every clip.
robot: g1
tags: [locomotion, walk, run, dance, flip, getup]
author: wbc-mjlab
links: {code: 'https://github.com/wbc-mjlab/wbc-mjlab'}
thumbnail: thumb.png
defaultClip: idle_02
camera: default
artifacts:
  onnx: policy.onnx
  config: config.yaml
  clips: {kind: manifest, file: reference/manifest.yaml, default: idle_02}
